<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'Anton';
      src: url('./node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background-color: #140d09;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container {
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 72px 88px;
      position: relative;
      background:
        radial-gradient(ellipse 650px 380px at 50% 30%, rgba(217, 138, 90, 0.16) 0%, rgba(20, 13, 9, 0) 70%),
        radial-gradient(circle 400px at 85% 15%, rgba(217, 138, 90, 0.08) 0%, rgba(20, 13, 9, 0) 60%),
        #140d09;
      border: 1px solid rgba(255, 200, 150, 0.1);
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .wordmark {
      font-family: 'Anton', Impact, sans-serif;
      font-size: 42px;
      letter-spacing: 1.5px;
      color: #f3e6da;
      text-transform: none;
      line-height: 1;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(42, 26, 17, 0.85);
      border: 1px solid rgba(217, 138, 90, 0.3);
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 500;
      color: #d98a5a;
      letter-spacing: 0.5px;
      width: fit-content;
      margin-bottom: 24px;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: #d98a5a;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(217, 138, 90, 0.8);
    }
    .content {
      display: flex;
      flex-direction: column;
    }
    .headline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 64px;
      font-weight: 700;
      color: #f3e6da;
      line-height: 1.15;
      letter-spacing: -1.5px;
      max-width: 950px;
    }
    .headline span.accent {
      color: #d98a5a;
    }
    .subtext {
      margin-top: 18px;
      font-size: 22px;
      color: #a89384;
      line-height: 1.4;
      max-width: 820px;
    }
    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 200, 150, 0.1);
      padding-top: 24px;
    }
    .feature-tags {
      display: flex;
      gap: 28px;
      font-size: 16px;
      color: #c4b5a8;
      font-weight: 500;
    }
    .feature-tag {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .feature-bullet {
      color: #d98a5a;
    }
    .domain {
      font-family: 'Anton', Impact, sans-serif;
      font-size: 20px;
      color: #a89384;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand-row">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="68" height="68">
        <defs>
          <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2a1a11" />
            <stop offset="60%" stop-color="#1e130d" />
            <stop offset="100%" stop-color="#140d09" />
          </linearGradient>
          <linearGradient id="grad" x1="15%" y1="90%" x2="90%" y2="10%">
            <stop offset="0%" stop-color="#d98a5a" />
            <stop offset="100%" stop-color="#c47a4a" />
          </linearGradient>
          <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(217, 138, 90, 0.45)" />
            <stop offset="45%" stop-color="rgba(255, 200, 150, 0.20)" />
            <stop offset="100%" stop-color="rgba(217, 138, 90, 0)" />
          </linearGradient>
        </defs>
        <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#tile)" stroke="rgba(217, 138, 90, 0.24)" stroke-width="1.2" />
        <path d="M 19 4 L 44 4 C 52 4 58.5 9.5 59.5 17" fill="none" stroke="url(#highlight)" stroke-width="1.2" stroke-linecap="round" />
        <path d="M 17 21 L 28 48 L 44 16 L 53 16" fill="none" stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 37 30 L 48 30" fill="none" stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 18 22 L 27.5 45 L 43 17" fill="none" stroke="#f3e6da" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
        <circle cx="28" cy="48" r="2.2" fill="#f3e6da" />
        <circle cx="28" cy="47.6" r="1" fill="#f3e6da" opacity="0.9" />
      </svg>
      <div class="wordmark">Volaitile Friday</div>
    </div>

    <div class="content">
      <div class="badge">
        <span class="badge-dot"></span>
        Unified Developer Workspace &amp; AI
      </div>
      <h1 class="headline">Code together. <span class="accent">Ask Friday.</span> Ship faster.</h1>
      <p class="subtext">Real-time collaborative code editor, cloud file tree, instant chat, and Gemini AI assistant.</p>
    </div>

    <div class="footer-row">
      <div class="feature-tags">
        <div class="feature-tag"><span class="feature-bullet">&#x25C6;</span> Real-Time Collaboration</div>
        <div class="feature-tag"><span class="feature-bullet">&#x25C6;</span> Friday AI Engine</div>
        <div class="feature-tag"><span class="feature-bullet">&#x25C6;</span> Cloud Workspace</div>
      </div>
      <div class="domain">VOLAITILE FRIDAY</div>
    </div>
  </div>
</body>
</html>
